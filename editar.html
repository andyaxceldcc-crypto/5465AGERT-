<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar - ANDYAXCEL LINK</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <header class="glass-header">
        <div class="header-left"><h1>ANDYAXCEL</h1><span class="badge">LINK</span></div>
        <nav class="header-nav">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Perfil</a>
            <a href="editar.html" class="active">Editar</a>
            <a href="configuracion.html">Config</a>
            <a href="musica.html">Música</a>
            <a href="redes.html">Redes</a>
            <a href="contacto.html">Contacto</a>
            <a href="ayuda.html">Ayuda</a>
        </nav>
        <button id="themeToggle" class="btn-icon">🌙</button>
    </header>
    <main class="container">
        <section class="edit-section glass-card">
            <h2>Editar Perfil</h2>
            <form id="editForm">
                <label>Nombre: <input type="text" id="editName" placeholder="Nombre"></label>
                <label>Usuario: <input type="text" id="editUsername" placeholder="@usuario"></label>
                <label>Biografía: <textarea id="editBio" placeholder="Biografía"></textarea></label>
                <label>Foto (URL): <input type="text" id="editAvatar" placeholder="URL de imagen"></label>
                <label>Portada (color o URL): <input type="text" id="editCover" placeholder="color o URL"></label>
                <button type="submit" class="btn-primary">Guardar Cambios</button>
            </form>
            <hr>
            <h3>Gestionar Enlaces</h3>
            <div id="linksManager"></div>
            <button id="addLinkBtn" class="btn-secondary">+ Agregar Enlace</button>
        </section>
    </main>
    <footer class="glass-footer">
        <p>&copy; 2026 ANDYAXCEL LINK</p>
    </footer>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/copy.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
    <script src="js/modal.js"></script>
</body>
</html>
